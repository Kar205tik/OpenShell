[package]
name = "openshell-driver-mxc"
description = "MXC (Windows isolation session) compute driver for OpenShell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "openshell_driver_mxc"

[[bin]]
name = "openshell-supervisor-relay"
path = "src/bin/supervisor-relay/main.rs"

[dependencies]
openshell-mxc-isolation-backend = { path = "../openshell-mxc-isolation-backend" }
openshell-sandbox-backend = { path = "../openshell-sandbox-backend" }
openshell-isolation-interface = { path = "../openshell-isolation-interface" }

openshell-core = { path = "../openshell-core", default-features = false }
openshell-policy = { path = "../openshell-policy" }
# OCSF builders + emit target used by the Windows ETW audit consumer. OS-agnostic
# crate (no windows deps), so safe to depend on from all targets; only the
# windows-gated `etw_consumer` module actually uses it.
openshell-ocsf = { path = "../openshell-ocsf" }
tokio = { workspace = true }
tonic = { workspace = true }
futures = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

# ETW/TDH real-time consumer and host CONNECT proxy integration.
[target.'cfg(target_os = "windows")'.dependencies]
anyhow = { workspace = true }
windows = { workspace = true }
# WebSocket relay embedded in the gateway for ProcessContainer host<->sandbox
# connectivity (see src/relay.rs).
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
# Per-forward auth nonce for the relay (see src/relay.rs module docs).
rand = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
# tempfile is not a workspace dependency; 3.27 is already resolved in Cargo.lock.
tempfile = "3"
# Needed by the real-wxc integration test (wxc_exec_real.rs) which builds
# --config-base64 payloads without going through the async WxcExecInvoker.
# Explicit development dependencies for the native integration fixtures.
base64 = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
# Parse the shipped gateway templates in cross-platform drift guards.
toml = { workspace = true }
# Used by the drift guard test (handled_fields_inventory) to parse YAML into a
# generic serde_json::Value for key enumeration.
serde_yml = { workspace = true }

[lints]
workspace = true
