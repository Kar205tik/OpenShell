[package]
name = "openshell-gateway"
description = "OpenShell gateway binary composition"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "openshell-gateway"
path = "src/main.rs"

[dependencies]
openshell-core = { path = "../openshell-core", default-features = false }
openshell-server = { path = "../openshell-server", default-features = false }
openshell-driver-registry = { path = "../openshell-driver-registry", default-features = false }
miette = { workspace = true }
tokio = { workspace = true }

[features]
default = ["telemetry", "in-tree-compute-drivers"]
telemetry = ["openshell-core/telemetry", "openshell-server/telemetry", "openshell-driver-registry/telemetry"]
in-tree-compute-drivers = ["openshell-driver-registry/in-tree-compute-drivers"]
defaults-without-telemetry = ["in-tree-compute-drivers", "openshell-driver-registry/defaults-without-telemetry"]
bundled-z3 = ["openshell-server/bundled-z3"]
prebuilt-z3 = ["openshell-server/prebuilt-z3"]
compute-driver-docker = ["openshell-driver-registry/compute-driver-docker"]
compute-driver-kubernetes = ["openshell-driver-registry/compute-driver-kubernetes"]
compute-driver-podman = ["openshell-driver-registry/compute-driver-podman"]
compute-driver-vm = ["openshell-driver-registry/compute-driver-vm"]
compute-driver-mxc = ["openshell-driver-registry/compute-driver-mxc"]

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
toml = { workspace = true }
